spring:
  application:
    name: cash-service
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${CASH_KEYCLOAK_CLIENT_ID:cash-service}
            client-secret: ${CASH_KEYCLOAK_CLIENT_SECRET:qSSVfNLbFKkmlvIN2rcuw23umfMd2y5d}
            authorization-grant-type: client_credentials
            scope:
              - openid
              - profile
              - email

        provider:
          keycloak-provider:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/bank}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/bank}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8080/realms/bank/protocol/openid-connect/certs}
  management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        show-details: always

server:
  port: 8080

services:
  accounts:
    url: ${ACCOUNTS_SERVICE_URL:http://localhost:3000}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:3003}

# Для отладки
logging:
  level:
    org.springframework.cloud.config.client: DEBUG
    org.springframework.web: DEBUG