spring:
  application:
    name: cash-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:http://localhost:9094}
  security:
    oauth2:
      client:
        registration:
          keycloak:  # имя регистрации
            provider: keycloak  # должно совпадать с именем в секции provider
            client-id: ${CASH_KEYCLOAK_CLIENT_ID:cash-service}
            client-secret: ${CASH_KEYCLOAK_CLIENT_SECRET:qSSVfNLbFKkmlvIN2rcuw23umfMd2y5d}
            authorization-grant-type: client_credentials
            scope:
              - openid
              - profile
              - email
        provider:
          keycloak:  # имя должно совпадать с provider в registration
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/bank}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/bank}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8080/realms/bank/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_SERVICE_URL:http://localhost:9411/api/v2/spans} # Эндпоинт Zipkin для приёма спанов
  tracing:
    sampling:
      probability: 1 # Сэмплируем все запросы

server:
  port: ${SERVER_PORT:8083}

kafka:
  topic:
    notification:
      name: "notification-topic"

services:
  accounts:
    url: ${ACCOUNTS_SERVICE_URL:http://localhost:8082}

# Для отладки
logging:
  level:
    org.springframework.kafka: INFO
    com.example.cash: ${LOGGING_LEVEL_APP:DEBUG}
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"