spring:
  datasource:
    url: ${DB_POSTGRES_URI:jdbc:postgresql://localhost:5432/bank}
    username: ${DB_POSTGRES_USERNAME:bank}
    password: ${DB_POSTGRES_PASSWORD:bank}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
server:
  port: 3000
management:
  endpoints:
    web:
      exposure:
        include: refresh