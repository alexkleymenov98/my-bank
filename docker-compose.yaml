version: '3.8'
services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - keycloak_data:/opt/keycloak/data
    ports:
      - "${KEYCLOAK_PORT}:8080"
    networks:
      - bank-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health/ready" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
  db:
    image: postgres:17
    container_name: database
    networks:
      - bank-network
    environment:
      - POSTGRES_DB=${DB_POSTGRES_NAME}
      - POSTGRES_USER=${DB_POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_bank_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_POSTGRES_USERNAME} -d ${DB_POSTGRES_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 10
  eureka-service:
    build:
      context: .
      dockerfile: eureka-service/Dockerfile
    container_name: eureka-service
    networks:
      - bank-network
    environment:
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO - http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'" ]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s

  config-service:
    build:
      context: .
      dockerfile: config-service/Dockerfile
    container_name: config-service
    ports:
      - "8088:8088"
    networks:
      - bank-network
    environment:
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - DB_POSTGRES_URI=${DB_POSTGRES_URI}
      - DB_POSTGRES_USERNAME=${DB_POSTGRES_USERNAME}
      - DB_POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_AUTH_URI=${KEYCLOAK_AUTH_URI}
      - KEYCLOAK_TOKEN_URI=${KEYCLOAK_TOKEN_URI}
      - KEYCLOAK_USERINFO_URI=${KEYCLOAK_USERINFO_URI}
      - KEYCLOAK_JWK_URI=${KEYCLOAK_JWK_URI}
      - ACCOUNTS_SERVICE_URL=${ACCOUNTS_SERVICE_URL}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL}
    depends_on:
      eureka-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8088/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: gateway-service
    ports:
      - "8001:8001"
    networks:
      - bank-network
    environment:
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - CONFIG_SERVICE_URL=${CONFIG_SERVICE_URL}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy

  accounts-service:
    build:
      context: .
      dockerfile: accounts-service/Dockerfile
    container_name: accounts-service
    ports:
      - "3000:3000"
    networks:
      - bank-network
    environment:
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - DB_POSTGRES_URI=${DB_POSTGRES_URI}
      - DB_POSTGRES_USERNAME=${DB_POSTGRES_USERNAME}
      - DB_POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD}
      - CONFIG_SERVICE_URL=${CONFIG_SERVICE_URL}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy

  cash-service:
    build:
      context: .
      dockerfile: cash-service/Dockerfile
    container_name: cash-service
    ports:
      - "3002:3002"
    networks:
      - bank-network
    environment:
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - CONFIG_SERVICE_URL=${CONFIG_SERVICE_URL}
      - DB_POSTGRES_URI=${DB_POSTGRES_URI}
      - DB_POSTGRES_USERNAME=${DB_POSTGRES_USERNAME}
      - DB_POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_AUTH_URI=${KEYCLOAK_AUTH_URI}
      - KEYCLOAK_TOKEN_URI=${KEYCLOAK_TOKEN_URI}
      - KEYCLOAK_USERINFO_URI=${KEYCLOAK_USERINFO_URI}
      - KEYCLOAK_JWK_URI=${KEYCLOAK_JWK_URI}
      - CASH_KEYCLOAK_CLIENT_ID=${CASH_KEYCLOAK_CLIENT_ID}
      - CASH_KEYCLOAK_CLIENT_SECRET=${CASH_KEYCLOAK_CLIENT_SECRET}
      - ACCOUNTS_SERVICE_URL=${ACCOUNTS_SERVICE_URL}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL}
    restart: on-failure
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      accounts-service:
        condition: service_started

  transfer-service:
    build:
      context: .
      dockerfile: transfer-service/Dockerfile
    container_name: transfer-service
    ports:
      - "3001:3001"
    networks:
      - bank-network
    environment:
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - CONFIG_SERVICE_URL=${CONFIG_SERVICE_URL}
      - DB_POSTGRES_URI=${DB_POSTGRES_URI}
      - DB_POSTGRES_USERNAME=${DB_POSTGRES_USERNAME}
      - DB_POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_AUTH_URI=${KEYCLOAK_AUTH_URI}
      - KEYCLOAK_TOKEN_URI=${KEYCLOAK_TOKEN_URI}
      - KEYCLOAK_USERINFO_URI=${KEYCLOAK_USERINFO_URI}
      - KEYCLOAK_JWK_URI=${KEYCLOAK_JWK_URI}
      - TRANSFER_KEYCLOAK_CLIENT_ID=${TRANSFER_KEYCLOAK_CLIENT_ID}
      - TRANSFER_KEYCLOAK_CLIENT_SECRET=${TRANSFER_KEYCLOAK_CLIENT_SECRET}
      - ACCOUNTS_SERVICE_URL=${ACCOUNTS_SERVICE_URL}
      - NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL}
    restart: on-failure
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      accounts-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "3003:3003"
    networks:
      - bank-network
    environment:
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - CONFIG_SERVICE_URL=${CONFIG_SERVICE_URL}
      - DB_POSTGRES_URI=${DB_POSTGRES_URI}
      - DB_POSTGRES_USERNAME=${DB_POSTGRES_USERNAME}
      - DB_POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_AUTH_URI=${KEYCLOAK_AUTH_URI}
      - KEYCLOAK_TOKEN_URI=${KEYCLOAK_TOKEN_URI}
      - KEYCLOAK_USERINFO_URI=${KEYCLOAK_USERINFO_URI}
      - KEYCLOAK_JWK_URI=${KEYCLOAK_JWK_URI}
      - NOTIFICATION_KEYCLOAK_CLIENT_ID=${NOTIFICATION_KEYCLOAK_CLIENT_ID}
      - NOTIFICATION_KEYCLOAK_CLIENT_SECRET=${NOTIFICATION_KEYCLOAK_CLIENT_SECRET}
    depends_on:
      accounts-service:
        condition: service_started
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy

  front-service:
    build:
      context: .
      dockerfile: front/Dockerfile
    container_name: front-service
    ports:
      - "8000:8000"
    networks:
      - bank-network
    environment:
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - CONFIG_SERVICE_URL=${CONFIG_SERVICE_URL}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_AUTH_URI=${FRONT_KEYCLOAK_AUTH_URI}
      - KEYCLOAK_TOKEN_URI=${KEYCLOAK_TOKEN_URI}
      - KEYCLOAK_USERINFO_URI=${KEYCLOAK_USERINFO_URI}
      - KEYCLOAK_JWK_URI=${KEYCLOAK_JWK_URI}
      - GATEWAY_SERVICE_URL=${GATEWAY_SERVICE_URL}
      - KEYCLOAK_CLIENT_ID=${FRONT_KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${FRONT_KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_REDIRECT_URI=${FRONT_KEYCLOAK_REDIRECT_URI}
    restart: on-failure
    depends_on:
      gateway-service:
        condition: service_started
      keycloak:
        condition: service_started
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy

networks:
  bank-network:

volumes:
  keycloak_data:
  postgres_bank_data: