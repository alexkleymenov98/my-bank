global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'my-bank-monitor'
    environment: 'local'

# Настройка Alertmanager (пока пусто)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Правила алертинга (пока пусто)
rule_files: []

# Основная конфигурация сбора метрик
scrape_configs:
  # 1. Сбор метрик с самого Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Сбор метрик с Accounts Service
  - job_name: 'accounts-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['host.docker.internal:8082']  # для macOS

  - job_name: 'cash-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: [ 'host.docker.internal:8083' ]  # для macOS

  - job_name: 'transfer-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: [ 'host.docker.internal:8084' ]  # для macOS

  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: [ 'host.docker.internal:8085' ]  # для macOS

  - job_name: 'front-ui'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: [ 'host.docker.internal:8000' ]  # для macOS

