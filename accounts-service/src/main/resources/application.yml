spring:
  application:
    name: accounts-service
  config:
    import: "optional:configserver:${CONFIG_SERVICE_URL:http://localhost:8088}"
    cloud:
      config:
        fail-fast: false
        retry:
          max-attempts: 30
          initial-interval: 2000
          multiplier: 1.5
          max-interval: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9000/realms/bank}  # URL вашего Keycloak
#          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761}/eureka/ # Адрес Eureka Server
  instance:
    prefer-ip-address: true

# Для отладки
logging:
  level:
    org.springframework.cloud.config.client: DEBUG
    org.springframework.web: DEBUG