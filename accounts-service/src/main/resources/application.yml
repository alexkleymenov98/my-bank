spring:
  application:
    name: accounts-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/bank}

  datasource:
    url: ${DB_POSTGRES_URI:jdbc:postgresql://localhost:5432/bank?currentSchema=bank_accounts}
    username: ${DB_POSTGRES_USERNAME:bank}
    password: ${DB_POSTGRES_PASSWORD:bank}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: bank_accounts

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: bank_accounts

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: bank_accounts

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: ${SERVER_PORT:8082}

logging:
  level:
    org.springframework.cloud.config.client: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    liquibase: DEBUG