# Grafana admin credentials.
#
# For a learning project this is hard-coded admin/admin via values; in
# production it should come from an external secret store (sealed-secrets,
# external-secrets-operator, Vault, etc.). Keeping it as a Secret rather
# than env-in-deployment so we don''t leak the password into kubectl
# describe / event logs.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ .Values.admin.user | quote }}
  admin-password: {{ .Values.admin.password | quote }}