# Provisioning provider: tells Grafana to load dashboard JSON files
# from /var/lib/grafana/dashboards (which is mounted from the
# grafana-dashboards ConfigMap).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-providers
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  providers.yaml: |
    apiVersion: 1
    providers:
      - name: bank-dashboards
        orgId: 1
        folder: Bank
        type: file
        disableDeletion: false
        # Reload changes from disk every 30s without needing a Grafana restart.
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false