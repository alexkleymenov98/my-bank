apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  labels:
    {{- include "elk.logstash.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "elk.logstash.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elk.logstash.labels" . | nindent 8 }}
      annotations:
        # Re-roll the pod whenever the pipeline config changes.
        checksum/pipeline: {{ include (print $.Template.BasePath "/logstash-configmap.yaml") . | sha256sum }}
    spec:
      # Wait for Elasticsearch to be reachable before starting Logstash —
      # otherwise the output plugin retries forever and floods logs.
      initContainers:
        - name: wait-for-es
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -ec
            - |
              echo "Waiting for Elasticsearch..."
              for i in $(seq 1 60); do
                if curl -fsS "http://elasticsearch:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null 2>&1; then
                  echo "Elasticsearch is ready"
                  exit 0
                fi
                echo "Attempt $i: ES not ready, retry in 3s"
                sleep 3
              done
              echo "Elasticsearch did not become ready in time"
              exit 1
      containers:
        - name: logstash
          image: "{{ .Values.logstash.image.repository }}:{{ .Values.logstash.image.tag }}"
          imagePullPolicy: {{ .Values.logstash.image.pullPolicy }}
          ports:
            - name: beats
              containerPort: 5044
              protocol: TCP
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms{{ .Values.logstash.heapSize }} -Xmx{{ .Values.logstash.heapSize }}"
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline/bank.conf
              subPath: bank.conf
            - name: pipeline
              mountPath: /usr/share/logstash/config/pipelines.yml
              subPath: pipelines.yml
          readinessProbe:
            tcpSocket:
              port: beats
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: beats
            initialDelaySeconds: 90
            periodSeconds: 30
      volumes:
        - name: pipeline
          configMap:
            name: logstash-pipeline
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  labels:
    {{- include "elk.logstash.labels" . | nindent 4 }}
spec:
  type: {{ .Values.logstash.service.type }}
  selector:
    {{- include "elk.logstash.selectorLabels" . | nindent 4 }}
  ports:
    - name: beats
      port: {{ .Values.logstash.service.port }}
      targetPort: beats
      protocol: TCP