{{- if .Values.elasticsearch.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  labels:
    {{- include "elk.elasticsearch.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.elasticsearch.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.elasticsearch.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  labels:
    {{- include "elk.elasticsearch.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Single-node ES + RWO PVC → only one pod at a time, so we tear down
  # the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "elk.elasticsearch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elk.elasticsearch.labels" . | nindent 8 }}
    spec:
      # The official ES image runs as uid 1000. The PVC must be writable
      # by that group, hence fsGroup. Without this initial files can''t
      # be created and the pod crashes with AccessDeniedException.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # ES needs vm.max_map_count >= 262144 — on k3s/Rancher Desktop the
      # host kernel usually already sets a high value, but an init
      # container with privileged sysctl is the documented workaround.
      # We skip it here (Rancher Desktop''s WSL kernel default is fine);
      # add it back if ES logs "max virtual memory areas vm.max_map_count
      # is too low" at startup.
      containers:
        - name: elasticsearch
          image: "{{ .Values.elasticsearch.image.repository }}:{{ .Values.elasticsearch.image.tag }}"
          imagePullPolicy: {{ .Values.elasticsearch.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
            - name: transport
              containerPort: 9300
              protocol: TCP
          env:
            # discovery.type=single-node skips the bootstrap election and
            # starts ES in a single-process mode. Mandatory for dev.
            - name: discovery.type
              value: single-node
            # Disable xpack security for dev (no TLS, no users). NEVER
            # turn this on in production — anyone on the network can
            # read/delete indices.
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.enrollment.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms{{ .Values.elasticsearch.heapSize }} -Xmx{{ .Values.elasticsearch.heapSize }}"
            - name: ingest.geoip.downloader.enabled
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
      volumes:
        - name: data
          {{- if .Values.elasticsearch.persistence.enabled }}
          persistentVolumeClaim:
            claimName: elasticsearch-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    {{- include "elk.elasticsearch.labels" . | nindent 4 }}
spec:
  type: {{ .Values.elasticsearch.service.type }}
  selector:
    {{- include "elk.elasticsearch.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.elasticsearch.service.port }}
      targetPort: http
      protocol: TCP
    - name: transport
      port: 9300
      targetPort: transport
      protocol: TCP