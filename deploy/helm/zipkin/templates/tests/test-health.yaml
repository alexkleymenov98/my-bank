# helm test pod - verifies that Zipkin answers /health.
# Run with: helm test <release> -n <namespace>
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-zipkin-test"
  labels:
    app.kubernetes.io/name: zipkin-test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: bank
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: curlimages/curl:8.5.0
      command:
        - sh
        - -ec
        - |
          echo "==> Probing Zipkin health endpoint"
          for i in $(seq 1 30); do
            if curl -fsS http://zipkin:9411/health; then
              echo
              echo "==> zipkin is ready"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 2s..."
            sleep 2
          done
          echo "zipkin did not become ready in time"
          exit 1
