apiVersion: v1
kind: Service
metadata:
  name: {{ include "zipkin.name" . }}
  labels:
    {{- include "zipkin.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.service.port | default 9411 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "zipkin.selectorLabels" . | nindent 4 }}
