# Zipkin - distributed tracing collector and UI.
#
# Default storage is in-memory (STORAGE_TYPE=mem), which is acceptable
# for the practicum task: traces survive a pod's lifetime but not a
# restart. For production, switch to elasticsearch and point at the
# ELK stack deployed in the elk/ subchart.

replicas: 1
port: 9411

image:
  repository: openzipkin/zipkin
  tag: "3.4"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9411

# Storage backend. Allowed values: mem | elasticsearch | mysql | cassandra3.
# We use `mem` here - trades persistence for simplicity. The ELK
# subchart's Elasticsearch can be reused later by switching this to
# `elasticsearch` and adding ES_HOSTS env.
storage:
  type: mem

# Sampling/processing tuning is handled by Zipkin defaults; we pass JVM
# heap limits to keep the container footprint predictable.
javaOpts: "-Xms256m -Xmx512m"

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi

# Pods will inherit umbrella .Values.global.hostAliases if set - useful
# only when Zipkin itself needs to call into other named hosts. The
# microservices will reach Zipkin by cluster DNS (http://zipkin:9411),
# so no hostAliases are required for trace ingestion.
global:
  imagePullPolicy: IfNotPresent
  hostAliases: []

# Tells Zipkin it's served under /zipkin so the UI generates correct
# absolute URLs and stops redirecting / back to /zipkin/.
basePath: /zipkin
