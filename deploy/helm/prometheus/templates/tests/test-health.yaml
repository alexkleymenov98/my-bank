# helm test pod — verifies Prometheus and Alertmanager are answering on /-/ready.
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-prometheus-test"
  labels:
    app.kubernetes.io/name: prometheus-test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: bank
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: curlimages/curl:8.5.0
      command:
        - sh
        - -ec
        - |
          echo "==> Probing prometheus and alertmanager readiness"
          for svc in "prometheus:9090{{ .Values.prometheus.routePrefix }}" \
                     "alertmanager:9093{{ .Values.alertmanager.routePrefix }}"; do
            for i in $(seq 1 30); do
              if curl -fsS "http://$svc/-/ready" > /dev/null; then
                echo "==> $svc is ready"
                break
              fi
              [ "$i" = "30" ] && { echo "$svc never became ready"; exit 1; }
              sleep 2
            done
          done
          echo "==> All probes succeeded"