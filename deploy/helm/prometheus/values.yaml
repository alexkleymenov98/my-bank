# Prometheus monitoring stack values.
#
# Both Prometheus and Alertmanager are minimally configured for learning:
# - Prometheus: in-memory TSDB with PVC backup, K8s SD via pod annotations
# - Alertmanager: in-memory, null receivers (alerts visible only in UI)
# - No external authentication, no TLS — internal cluster use only
# - Ingress paths /prometheus and /alertmanager with rewrite-target

prometheus:
  image:
    repository: prom/prometheus
    tag: v2.55.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090
  # External URL is set so links in Prometheus UI (e.g. alert "Source" links)
  # resolve through ingress rather than internal pod IPs.
  externalUrl: http://bank.local/prometheus
  # Path prefix is required because the ingress strips /prometheus from the URL,
  # so Prometheus needs to know it lives under that base path to render links.
  routePrefix: /prometheus
  retention: 7d
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""

alertmanager:
  image:
    repository: prom/alertmanager
    tag: v0.27.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9093
  externalUrl: http://bank.local/alertmanager
  routePrefix: /alertmanager