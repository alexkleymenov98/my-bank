spring:
  application:
    name: gateway-service
  config:
    import: "optional:configserver:${CONFIG_SERVICE_URL:http://localhost:8088}"
    cloud:
      config:
        fail-fast: false
        retry:
          max-attempts: 30
          initial-interval: 2000
          multiplier: 1.5
          max-interval: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9000/realms/bank}

# Для отладки
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.filter: DEBUG
    reactor.netty.http.client: DEBUG